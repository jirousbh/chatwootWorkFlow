version: '3'

networks:
  chatwoot-prd:
    name: chatwoot-prd
    driver: bridge

services:
  base: &base
    image: chatwoot/chatwoot:latest
    env_file: .envinovai ## Change this file for customized env variables
    volumes:
      - ./data/storage:/app/storage
    networks:
      - chatwoot-prd

  rails:
    <<: *base
    container_name: rails-prd
    env_file: .envinovai ## Change this file for customized env variables
    depends_on:
      - postgres-prd
      - redis-prd
    ports:
      - '127.0.0.1:4500:4500'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '4500', '-b', '0.0.0.0']
    restart: always
    networks:
      - chatwoot-prd

  sidekiq:
    <<: *base
    container_name: sidekiq-prd
    env_file: .envinovai ## Change this file for customized env variables
    depends_on:
      - postgres-prd
      - redis-prd
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always
    networks:
      - chatwoot-prd

  # Evolution API - WhatsApp API Service
  evolution_api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - redis-prd
      - postgres-prd
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./data/evolution_instances:/evolution/instances
    env_file:
      - .env-evolution
    expose:
      - 8080
    networks:
      - chatwoot-prd

  postgres-prd:
    container_name: postgres-prd
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5490:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      # Please provide your own password.
      - POSTGRES_PASSWORD=invoAI@76825
      - TZ=America/Sao_Paulo
    networks:
      - chatwoot-prd

  redis-prd:
    container_name: redis-prd
    image: redis:alpine
    restart: always
    command: redis-server --requirepass invoAI@76825
    volumes:
      - ./data/redis:/data
    ports:
      - '127.0.0.1:6390:6379'
    environment:
      - REDIS_PASSWORD=invoAI@76825
    networks:
      - chatwoot-prd

  # Sistema de Workflows de Chatbot
  chatbot-workflows-prd:
    container_name: chatbot-workflows-prd
    build: ./workflows
    ports:
      - '127.0.0.1:3001:3001'
    env_file: env-workflows
    environment:
      - CHATWOOT_BASE_URL=https://crm.inovaianalytics.com.br
      - PORT=3001
      - TZ=America/Sao_Paulo
    volumes:
      - ./workflows/chatbot-workflow-system.js:/app/chatbot-workflow-system.js
      - ./data/workflows-logs:/app/logs
      - ./data/workflows-uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      - postgres-prd
      - redis-prd
    networks:
      - chatwoot-prd

  # Sistema de Agentes IA
  ia-agent-prd:
    container_name: ia-agent-prd
    build: ./ia-agent
    ports:
      - '127.0.0.1:3008:3006'
    env_file: .env-ia-agent-prd
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./data/ia-agent:/data/ia-agent  # Volume para dados dos agentes
    restart: unless-stopped
    depends_on:
      - postgres-prd
      - redis-prd
    networks:
      - chatwoot-prd

volumes:
  evolution_instances:
